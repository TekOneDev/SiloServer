name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # common/ is TekOneDev/SiloCommon (private): a read-only token for it is stored as SILOCOMMON_TOKEN.
          submodules: true
          token: ${{ secrets.SILOCOMMON_TOKEN }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/Silo.Tests -c Release --nologo
      - name: Build the server and plugin host
        run: |
          dotnet build src/Silo.Server -c Release --nologo
          dotnet build src/Silo.PluginHost -c Release --nologo
      - name: Sandbox self-test (plugins cannot read the index, write, or start programs)
        run: dotnet src/Silo.PluginHost/bin/Release/net10.0/Silo.PluginHost.dll --sandbox-selftest
      - name: Installer scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem installer -Filter *.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: Packages with known vulnerabilities
        shell: bash
        run: |
          for p in src/Silo.Server src/Silo.PluginHost; do
            out=$(dotnet list "$p" package --vulnerable --include-transitive)
            echo "$out"
            if echo "$out" | grep -q "has the following vulnerable packages"; then exit 1; fi
          done
