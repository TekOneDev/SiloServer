<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silo — mining data search</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="/img/silo.svg">
<link rel="stylesheet" href="/lib/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
<script>
  // Theme before first paint: saved choice, else the system setting.
  (function () {
    var t = null; try { t = localStorage.getItem("silo.theme"); } catch (e) {}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<div id="app"></div>
<script src="/lib/leaflet/leaflet.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
